<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 Crop Recommendation Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #A5D6A7; /* Light green background */
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff; /* White background for the form */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #388E3C; /* Dark green for the title */
      font-size: 28px;
      margin-bottom: 20px;
    }

    .description {
      font-size: 16px;
      color: #555;
      margin-top: 20px;
    }

    .back-button {
      display: block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #388E3C;
      color: white;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
    }

    .back-button:hover {
      background-color: #2C6B2F;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 Crop Recommendation Result</h1>

    <div id="cropResult">
      <!-- Crop result will be inserted here -->
    </div>

    <div id="cropDescription" class="description">
      <!-- Description will be inserted here -->
    </div>

    <a href="index.html" class="back-button">Back to Form</a>
  </div>

  <script>
    // Get the crop and description from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const crop = urlParams.get('crop');
    const description = urlParams.get('description');

    // Display the crop and description
    document.getElementById('cropResult').innerText = `🌱 Recommended Crop: ${crop}`;
    document.getElementById('cropDescription').innerText = description;
  </script>
</body>
</html>
