<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 Crop Recommendation System</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #A5D6A7; /* Light green background */
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 50px auto;
      background-color: #ffffff; /* White background for the form */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #388E3C; /* Dark green for the title */
      font-size: 28px;
      margin-bottom: 20px;
    }

    .description {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 500;
      color: #388E3C; /* Dark green for labels */
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 14px;
      border: 1px solid #4CAF50; /* Green border for inputs */
      border-radius: 5px;
      box-sizing: border-box;
      background-color: #f1f8e9; /* Light green background for inputs */
    }

    .input-group input:hover {
      border-color: #2C6B2F; /* Darker green border on hover */
      background-color: #e8f5e9; /* Light hover effect */
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #388E3C; /* Dark green for the button */
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #2C6B2F; /* Slightly darker green on hover */
    }

    .result {
      margin-top: 20px;
      text-align: center;
      font-size: 24px; /* Increased font size */
      font-weight: bold;
      color: #FF7043; /* Unique color (Orange shade) */
      text-transform: uppercase; /* Make the output more noticeable */
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>🌾 Crop Recommendation System</h1>
    <p class="description">Enter the details below to receive a crop recommendation based on soil and climate conditions.</p>

    <form id="cropForm">
      <div class="input-group">
        <label for="nitrogen">Nitrogen (N) - kg/ha</label>
        <input type="number" id="nitrogen" required />
      </div>
      <div class="input-group">
        <label for="phosphorus">Phosphorus (P) - kg/ha</label>
        <input type="number" id="phosphorus" required />
      </div>
      <div class="input-group">
        <label for="potassium">Potassium (K) - kg/ha</label>
        <input type="number" id="potassium" required />
      </div>
      <div class="input-group">
        <label for="temperature">Temperature (°C)</label>
        <input type="number" step="0.1" id="temperature" required />
      </div>
      <div class="input-group">
        <label for="humidity">Humidity (%)</label>
        <input type="number" step="0.1" id="humidity" required />
      </div>
      <div class="input-group">
        <label for="ph">Soil pH</label>
        <input type="number" step="0.1" id="ph" required />
      </div>
      <div class="input-group">
        <label for="rainfall">Rainfall (mm)</label>
        <input type="number" step="0.1" id="rainfall" required />
      </div>

      <button type="submit">Get Crop Recommendation</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script>
    document.getElementById('cropForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        N: document.getElementById('nitrogen').value,
        P: document.getElementById('phosphorus').value,
        K: document.getElementById('potassium').value,
        temperature: document.getElementById('temperature').value,
        humidity: document.getElementById('humidity').value,
        ph: document.getElementById('ph').value,
        rainfall: document.getElementById('rainfall').value
      };

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (result.crop) {
          document.getElementById('result').innerText = `🌱 Recommended Crop: ${result.crop}`;
        } else {
          document.getElementById('result').innerText = `⚠️ Error: ${result.error}`;
        }
      } catch (err) {
        document.getElementById('result').innerText = '⚠️ Error: Could not fetch recommendation.';
      }
    });
  </script>
</body>
</html>
